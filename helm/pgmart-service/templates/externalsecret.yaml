# External Secrets copies the AWS Secrets Manager secret into a Kubernetes Secret with the same name as the service.
# It checks for new values every hour; Reloader then restarts the pods (annotation in deployment.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pgmart-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secret.storeName }}
  target:
    name: {{ .Release.Name }}
  dataFrom:
    - extract:
        key: {{ .Values.secret.remoteKey }}
