apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pgmart-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pgmart-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
