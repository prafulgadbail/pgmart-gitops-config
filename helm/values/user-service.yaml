# user-service: sign-up, login, profile and addresses

image:
  repository: 938145531848.dkr.ecr.ap-south-1.amazonaws.com/pgmart-gitops/user-service
  tag: set-by-ci

# Plain settings (ConfigMap)
env:
  DB_SSLMODE: require
  JWT_TTL: 24h
  SMTP_HOST: email-smtp.ap-south-1.amazonaws.com
  SMTP_PORT: "587"
  SMTP_AUTH: "true"
  SMTP_STARTTLS: "true"
  MAIL_FROM: PGMart <no-reply@aws.prafulgadbail.online>
  ADMIN_EMAIL: admin@aws.prafulgadbail.online

# Keys in the AWS Secrets Manager secret:
#   database: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   app:      JWT_SECRET, ADMIN_PASSWORD
#   mail:     SMTP_USERNAME, SMTP_PASSWORD
secret:
  remoteKey: pgmart-gitops/user-service

ingress:
  paths:
    - /api/auth
    - /api/users
